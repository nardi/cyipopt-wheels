name: Build cyipopt wheel
description: >-
  Obtains Ipopt, builds one cyipopt wheel from its PyPI sdist, and bundles the
  shared libraries into the wheel. The Python on PATH builds the wheel, so set
  it up before using this action.
inputs:
  version:
    description: "cyipopt version to build from its sdist on PyPI."
    required: true
runs:
  using: composite
  steps:
    # Obtains Ipopt and its dependencies from the Julia binary builders with
    # meson-jll. Meson fetches the tarballs and installs the runtime libraries
    # into the prefix below, which is the layout the wheel repair tools read.
    - name: Fetch Ipopt with meson-jll
      if: runner.os != 'Windows'
      shell: bash
      env:
        MESON_JLL_VERSION: "0.1.1"
      run: |
        set -euo pipefail

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) meson_jll_triple="x86_64-unknown-linux-musl" ;;
          macOS-ARM64) meson_jll_triple="aarch64-apple-darwin" ;;
          macOS-X64) meson_jll_triple="x86_64-apple-darwin" ;;
          *)
            echo "No meson-jll binary exists for ${RUNNER_OS}-${RUNNER_ARCH}." >&2
            exit 1
            ;;
        esac

        # The cyipopt build calls pkg-config, which the runner images do not always provide.
        if [[ "${RUNNER_OS}" == "Linux" ]]; then
          dnf install -y pkgconf-pkg-config
        else
          command -v pkg-config >/dev/null || brew install pkgconf
        fi
        python -m pip install --upgrade meson ninja

        meson_jll_directory="${RUNNER_TEMP}/meson-jll"
        mkdir -p "${meson_jll_directory}"
        curl --fail --location --silent --show-error \
          --output "${meson_jll_directory}/meson-jll.tar.gz" \
          "https://github.com/nardi/meson-jll/releases/download/v${MESON_JLL_VERSION}/meson-jll-${meson_jll_triple}.tar.gz"
        tar -xzf "${meson_jll_directory}/meson-jll.tar.gz" -C "${meson_jll_directory}"
        chmod +x "${meson_jll_directory}/meson-jll"

        # The project has no sources. It only makes Meson fetch the JLL wraps.
        fetch_directory="${RUNNER_TEMP}/ipopt-fetch"
        mkdir -p "${fetch_directory}"
        printf '%s\n' \
          "project('ipopt-fetch', 'c')" \
          "dependency('Ipopt_jll')" \
          "dependency('OpenBLAS_jll')" > "${fetch_directory}/meson.build"

        (
          cd "${fetch_directory}"
          # The root packages come from their repositories directly. A name lookup
          # goes through the GitHub API, which the shared runner addresses exhaust.
          "${meson_jll_directory}/meson-jll" install Ipopt 300.1400.2000+1 \
            --url https://github.com/JuliaBinaryWrappers/Ipopt_jll.jl
          "${meson_jll_directory}/meson-jll" install OpenBLAS 0.3.30+1 \
            --url https://github.com/JuliaBinaryWrappers/OpenBLAS_jll.jl
          meson setup build --prefix "${RUNNER_TEMP}/ipopt-prefix" --libdir lib
          meson install -C build
        )

        # The Ipopt tarball ships a relocatable ipopt.pc that points into its own directory.
        ipopt_pkgconfig_file="$(find "${fetch_directory}/subprojects" -path '*/lib/pkgconfig/ipopt.pc' | sed -n '1p')"
        if [[ -z "${ipopt_pkgconfig_file}" ]]; then
          echo "The fetched Ipopt tarball does not contain lib/pkgconfig/ipopt.pc." >&2
          exit 1
        fi

        echo "PKG_CONFIG_PATH=$(dirname "${ipopt_pkgconfig_file}")" >> "${GITHUB_ENV}"
        echo "IPOPT_PREFIX=${RUNNER_TEMP}/ipopt-prefix" >> "${GITHUB_ENV}"
        echo "IPOPT_LIBRARY_PREFIX=${RUNNER_TEMP}/ipopt-prefix" >> "${GITHUB_ENV}"

    # Windows still takes Ipopt from conda-forge. The MinGW DLLs of the Julia
    # binary builders need import libraries before MSVC can link against them.
    - name: Install Ipopt from conda-forge
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -euo pipefail

        micromamba_executable="${RUNNER_TEMP}/micromamba.exe"
        # Forward slashes keep the prefix usable by both bash and the Windows tools.
        ipopt_prefix="$(cygpath -m "${RUNNER_TEMP}/ipopt-env")"
        library_prefix="${ipopt_prefix}/Library"

        curl --fail --location --silent --show-error \
          --output "${micromamba_executable}" \
          "https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-win-64.exe"
        chmod +x "${micromamba_executable}"

        "${micromamba_executable}" create --yes \
          --root-prefix "${RUNNER_TEMP}/micromamba-root" \
          --prefix "${ipopt_prefix}" \
          --channel conda-forge --override-channels \
          ipopt pkg-config

        echo "PKG_CONFIG_PATH=${library_prefix}/lib/pkgconfig" >> "${GITHUB_ENV}"
        echo "${library_prefix}/bin" >> "${GITHUB_PATH}"
        echo "IPOPT_PREFIX=${ipopt_prefix}" >> "${GITHUB_ENV}"
        echo "IPOPT_LIBRARY_PREFIX=${library_prefix}" >> "${GITHUB_ENV}"

    # The deployment target must not be lower than the one the Ipopt libraries
    # were built for, and the rpath lets delocate find them. The architecture
    # flags stop the python.org interpreters from building a universal2
    # extension, because the Ipopt libraries have one architecture.
    - name: Set macOS build flags
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        # Both architectures target macOS 11.0.
        deployment_target="11.0"
        if [[ "${RUNNER_ARCH}" == "ARM64" ]]; then
          architecture="arm64"
        else
          architecture="x86_64"
        fi
        echo "MACOSX_DEPLOYMENT_TARGET=${deployment_target}" >> "${GITHUB_ENV}"
        echo "_PYTHON_HOST_PLATFORM=macosx-${deployment_target}-${architecture}" >> "${GITHUB_ENV}"
        echo "ARCHFLAGS=-arch ${architecture}" >> "${GITHUB_ENV}"
        echo "LDFLAGS=-Wl,-rpath,${IPOPT_LIBRARY_PREFIX}/lib" >> "${GITHUB_ENV}"

    # Builds from the sdist, so the wheel always links against the Ipopt
    # installed above and never against a binary wheel from PyPI.
    - name: Build the cyipopt wheel from its sdist
      shell: bash
      env:
        CYIPOPT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python -m pip wheel --no-deps --no-binary cyipopt \
          --wheel-dir "${RUNNER_TEMP}/raw-wheels" \
          "cyipopt==${CYIPOPT_VERSION}"
        ls -l "${RUNNER_TEMP}/raw-wheels"

    # Copies the Ipopt shared libraries into the wheel and retags it for the
    # platform. Each tool gets the library locations it needs to resolve them.
    - name: Bundle the shared libraries into the wheel
      shell: bash
      run: |
        set -euo pipefail
        repaired_wheel_directory="${RUNNER_TEMP}/repaired-wheels"
        raw_wheel_directory="${RUNNER_TEMP}/raw-wheels"

        if [[ "${RUNNER_OS}" == "Linux" ]]; then
          python -m pip install --upgrade auditwheel patchelf
          shopt -s nullglob
          # Prints the newest symbol versions that each library requires.
          for shared_library in \
            "${IPOPT_LIBRARY_PREFIX}"/lib/libipopt*.so* \
            "${IPOPT_LIBRARY_PREFIX}"/lib/libcoin*.so* \
            "${IPOPT_LIBRARY_PREFIX}"/lib/libgfortran*.so* \
            "${IPOPT_LIBRARY_PREFIX}"/lib/libstdc++*.so* \
            "${IPOPT_LIBRARY_PREFIX}"/lib/libgcc_s*.so*; do
            echo "== ${shared_library}"
            objdump -T "${shared_library}" | grep -o -E '(GLIBC|GLIBCXX|CXXABI)_[0-9.]+' | sort -uV | paste -sd ' ' || true
          done
          for raw_wheel in "${raw_wheel_directory}"/*.whl; do
            auditwheel show "${raw_wheel}" || true
          done
          LD_LIBRARY_PATH="${IPOPT_LIBRARY_PREFIX}/lib" auditwheel -v repair \
            --plat manylinux_2_28_x86_64 \
            --wheel-dir "${repaired_wheel_directory}" \
            "${raw_wheel_directory}"/*.whl
        elif [[ "${RUNNER_OS}" == "macOS" ]]; then
          if [[ "${RUNNER_ARCH}" == "ARM64" ]]; then
            architecture="arm64"
          else
            architecture="x86_64"
          fi
          python -m pip install --upgrade delocate
          delocate-wheel --require-archs "${architecture}" \
            --wheel-dir "${repaired_wheel_directory}" \
            -v "${raw_wheel_directory}"/*.whl
        else
          python -m pip install --upgrade delvewheel
          delvewheel repair \
            --add-path "$(cygpath -w "${IPOPT_LIBRARY_PREFIX}/bin")" \
            --wheel-dir "${repaired_wheel_directory}" \
            "${raw_wheel_directory}"/*.whl
        fi

        # The listing shows which libraries the wheel carries.
        python -m zipfile -l "${repaired_wheel_directory}"/*.whl

    # Shows which libraries each binary of the repaired wheel links against, so
    # a missing library appears in this log before the test job runs.
    - name: Inspect the libraries that the wheel links against
      if: runner.os != 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        extracted_wheel_directory="$(mktemp -d)"
        python -m zipfile -e "${RUNNER_TEMP}/repaired-wheels"/*.whl "${extracted_wheel_directory}"
        if [[ "${RUNNER_OS}" == "macOS" ]]; then
          for binary in "${extracted_wheel_directory}"/cyipopt/.dylibs/*.dylib "${extracted_wheel_directory}"/cyipopt/*.so; do
            echo "== ${binary#"${extracted_wheel_directory}"/}"
            otool -L "${binary}"
          done
          ls -l "${IPOPT_LIBRARY_PREFIX}/lib" | grep -E "blas|lapack" || true
        else
          python "${GITHUB_WORKSPACE}/scripts/list_binary_dependencies.py" "${extracted_wheel_directory}"
          ls -l "${IPOPT_LIBRARY_PREFIX}/bin" | grep -i "dll" || true
        fi
