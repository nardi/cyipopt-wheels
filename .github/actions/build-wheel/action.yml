name: Build cyipopt wheel
description: >-
  Builds one cyipopt wheel from its PyPI sdist with meson-python. Ipopt and OpenBLAS come from
  the Julia binary builders through meson-jll, and the repair tool bundles the shared libraries
  into the wheel. The Python on PATH builds the wheel, so set it up before using this action.
inputs:
  version:
    description: "cyipopt version to build from its sdist on PyPI."
    required: true
runs:
  using: composite
  steps:
    # The meson-jll release binary comes from the release that this action pins. The Linux
    # binary is linked statically, so it runs on any distribution.
    - name: Install meson-jll
      shell: bash
      env:
        MESON_JLL_VERSION: "0.1.1"
      run: |
        set -euo pipefail

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)
            meson_jll_triple="x86_64-unknown-linux-musl"
            archive_extension="tar.gz"
            ;;
          macOS-ARM64)
            meson_jll_triple="aarch64-apple-darwin"
            archive_extension="tar.gz"
            ;;
          Windows-X64)
            meson_jll_triple="x86_64-pc-windows-msvc"
            archive_extension="zip"
            ;;
          *)
            echo "No meson-jll binary exists for ${RUNNER_OS}-${RUNNER_ARCH}." >&2
            exit 1
            ;;
        esac

        meson_jll_directory="${RUNNER_TEMP}/meson-jll"
        mkdir -p "${meson_jll_directory}"
        curl --fail --location --silent --show-error \
          --output "${meson_jll_directory}/archive.${archive_extension}" \
          "https://github.com/nardi/meson-jll/releases/download/v${MESON_JLL_VERSION}/meson-jll-${meson_jll_triple}.${archive_extension}"

        if [[ "${archive_extension}" == "zip" ]]; then
          python -m zipfile -e "${meson_jll_directory}/archive.zip" "${meson_jll_directory}"
          meson_jll_executable="${meson_jll_directory}/meson-jll.exe"
        else
          tar -xzf "${meson_jll_directory}/archive.tar.gz" -C "${meson_jll_directory}"
          chmod +x "${meson_jll_directory}/meson-jll"
          meson_jll_executable="${meson_jll_directory}/meson-jll"
        fi
        echo "MESON_JLL_EXECUTABLE=${meson_jll_executable}" >> "${GITHUB_ENV}"

    # The sdist keeps its own sources, and the packaging files replace its build
    # configuration. The wraps of the JLL packages go into `subprojects`, which Meson reads.
    # The versions are pinned, and the repositories are named directly, because a name lookup
    # goes through the GitHub API, which the runners exhaust.
    - name: Prepare the sdist
      shell: bash
      env:
        CYIPOPT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        # The URL comes from the PyPI JSON API. `pip download` would prepare the metadata of the
        # original setuptools build, and `--no-binary :all:` would build the build tools from source.
        sdist_directory="${RUNNER_TEMP}/cyipopt-sdist"
        mkdir -p "${sdist_directory}"
        sdist_url="$(python -c '
        import json
        import sys
        import urllib.request

        with urllib.request.urlopen(f"https://pypi.org/pypi/cyipopt/{sys.argv[1]}/json", timeout=60) as response:
            release = json.load(response)
        print(next(file["url"] for file in release["urls"] if file["packagetype"] == "sdist"))
        ' "${CYIPOPT_VERSION}")"
        curl --fail --location --silent --show-error \
          --output "${sdist_directory}/cyipopt-${CYIPOPT_VERSION}.tar.gz" \
          "${sdist_url}"
        # Python extracts the archive, because the tar of Windows reads `D:` as a remote host.
        python -m tarfile -e "${sdist_directory}/cyipopt-${CYIPOPT_VERSION}.tar.gz" "${sdist_directory}"
        source_directory="${sdist_directory}/cyipopt-${CYIPOPT_VERSION}"
        echo "CYIPOPT_SOURCE_DIRECTORY=${source_directory}" >> "${GITHUB_ENV}"

        cp "${GITHUB_WORKSPACE}/packaging/pyproject.toml" "${source_directory}/pyproject.toml"
        cp "${GITHUB_WORKSPACE}/packaging/meson.build" "${source_directory}/meson.build"
        cp "${GITHUB_WORKSPACE}/packaging/cyipopt.meson.build" "${source_directory}/cyipopt/meson.build"
        python "${GITHUB_WORKSPACE}/scripts/forward_blas_to_openblas.py" \
          "${source_directory}/cyipopt/__init__.py"

        (
          cd "${source_directory}"
          "${MESON_JLL_EXECUTABLE}" install Ipopt 300.1400.2000+1 \
            --url https://github.com/JuliaBinaryWrappers/Ipopt_jll.jl
          "${MESON_JLL_EXECUTABLE}" install OpenBLAS32 0.3.30+1 \
            --url https://github.com/JuliaBinaryWrappers/OpenBLAS32_jll.jl
        )

    # The wheel is built from the prepared sdist, so it never links against a binary wheel
    # from PyPI. meson-python builds the extension and folds the JLL libraries into the wheel.
    - name: Build the cyipopt wheel
      shell: bash
      run: |
        set -euo pipefail

        if [[ "${RUNNER_OS}" == "macOS" ]]; then
          # Without a target the wheel is tagged for the macOS version of the runner.
          export MACOSX_DEPLOYMENT_TARGET="11.0"
          python -m pip wheel --no-deps \
            --wheel-dir "${RUNNER_TEMP}/raw-wheels" \
            "${CYIPOPT_SOURCE_DIRECTORY}"

          # Xcode's strip rejects the option that Meson passes, so the libraries are stripped
          # here and signed again, which the arm64 loader requires.
          python -m pip install --upgrade wheel
          python -m wheel unpack --dest "${RUNNER_TEMP}/unpacked-wheel" "${RUNNER_TEMP}/raw-wheels"/*.whl
          find "${RUNNER_TEMP}/unpacked-wheel" \( -name '*.dylib' -o -name '*.so' \) -exec strip -x {} +
          find "${RUNNER_TEMP}/unpacked-wheel" \( -name '*.dylib' -o -name '*.so' \) -exec codesign --force --sign - {} +
          rm "${RUNNER_TEMP}/raw-wheels"/*.whl
          python -m wheel pack --dest-dir "${RUNNER_TEMP}/raw-wheels" "${RUNNER_TEMP}/unpacked-wheel"/cyipopt-*
        elif [[ "${RUNNER_OS}" == "Linux" ]]; then
          # Meson strips the debug information of the JLL libraries.
          python -m pip wheel --no-deps \
            --config-settings=setup-args=-Dstrip=true \
            --wheel-dir "${RUNNER_TEMP}/raw-wheels" \
            "${CYIPOPT_SOURCE_DIRECTORY}"

          # The loader needs only some of the bundled libraries, so the wheel is pruned
          # before the repair tool sees it.
          python -m pip install --upgrade wheel patchelf pyelftools
          python -m wheel unpack --dest "${RUNNER_TEMP}/unpacked-wheel" "${RUNNER_TEMP}/raw-wheels"/*.whl
          python "${GITHUB_WORKSPACE}/scripts/prune_linux_wheel.py" "${RUNNER_TEMP}/unpacked-wheel"/cyipopt-*
          rm "${RUNNER_TEMP}/raw-wheels"/*.whl
          python -m wheel pack --dest-dir "${RUNNER_TEMP}/raw-wheels" "${RUNNER_TEMP}/unpacked-wheel"/cyipopt-*
        else
          # Meson strips the debug information of the JLL libraries.
          python -m pip wheel --no-deps \
            --config-settings=setup-args=-Dstrip=true \
            --wheel-dir "${RUNNER_TEMP}/raw-wheels" \
            "${CYIPOPT_SOURCE_DIRECTORY}"

          # The extension module keeps only the imports of the DLLs that the loader needs.
          # LIEF rewrites its import table, which is why the version is pinned.
          python -m pip install --upgrade wheel "lief==1.0.0"
          python -m wheel unpack --dest "${RUNNER_TEMP}/unpacked-wheel" "${RUNNER_TEMP}/raw-wheels"/*.whl
          python "${GITHUB_WORKSPACE}/scripts/prune_windows_wheel.py" "${RUNNER_TEMP}/unpacked-wheel"/cyipopt-*
          rm "${RUNNER_TEMP}/raw-wheels"/*.whl
          python -m wheel pack --dest-dir "${RUNNER_TEMP}/raw-wheels" "${RUNNER_TEMP}/unpacked-wheel"/cyipopt-*
        fi
        ls -l "${RUNNER_TEMP}/raw-wheels"

    # The repair tool bundles the libraries that the wheel needs from outside the wheel, and
    # retags the wheel for the platform.
    - name: Repair the wheel
      shell: bash
      run: |
        set -euo pipefail

        repaired_wheel_directory="${RUNNER_TEMP}/repaired-wheels"
        raw_wheel_directory="${RUNNER_TEMP}/raw-wheels"

        if [[ "${RUNNER_OS}" == "Linux" ]]; then
          python -m pip install --upgrade auditwheel patchelf
          auditwheel repair \
            --plat manylinux_2_28_x86_64 \
            --wheel-dir "${repaired_wheel_directory}" \
            "${raw_wheel_directory}"/*.whl
        elif [[ "${RUNNER_OS}" == "macOS" ]]; then
          python -m pip install --upgrade delocate
          delocate-wheel --require-archs arm64 \
            --wheel-dir "${repaired_wheel_directory}" \
            -v "${raw_wheel_directory}"/*.whl
        else
          # delvewheel cannot see the DLLs that meson-python keeps in `.cyipopt.mesonpy.libs`,
          # and those DLLs already carry the JLL libraries. The wheel is kept as it is, and the
          # test job checks that every DLL loads in a clean environment.
          mkdir -p "${repaired_wheel_directory}"
          cp "${raw_wheel_directory}"/*.whl "${repaired_wheel_directory}/"
        fi

        # The listing shows which libraries the wheel carries.
        python -m zipfile -l "${repaired_wheel_directory}"/*.whl
